name: architectural-drift

# Weekly architectural drift sweep + retention prune.
#
# UPSTREAM-OWNED — deployed from Lbstrydom/claude-engineering-skills
# (.github/workflows/architectural-drift.yml). Do NOT patch this file here:
# the edit is invisible to upstream review and the bug persists for every
# other consumer. Fix it upstream and re-deploy.
#
# Adapted from the source-repo original for the CONSUMER layout. Deliberate
# differences, each load-bearing:
#
#   1. HYDRATION. The audit-loop tooling lives under scripts/.claude-skills/,
#      which this repo gitignores — so it is ABSENT from a fresh CI checkout
#      and must be fetched from upstream before any arch:* script can run.
#      Mirrors the proven hydration step in arch-drift-scoped.yml.
#   2. INDIRECTION. Entry points are invoked through the package.json arch:*
#      scripts, never by hardcoded path: upstream's
#      scripts/symbol-index/drift.mjs is scripts/.claude-skills/symbol-index/
#      drift.mjs here, and the consumer path map is not ours to hand-compute.
#   3. HARD PREFLIGHT. This copy has always failed loud on a missing DSN
#      (upstream warned-and-skipped until 2026-09-13, when it adopted the
#      same hard-fail here — no longer a divergence, kept as history).
#   4. SELF-HOSTED RUNNER (2026-09-13). AUDIT_DB_URL points at a private-LAN
#      NAS; a GitHub-hosted runner has no route to it at all. This ran on
#      ubuntu-latest — correctly failing every scheduled run via #3 above,
#      never a false green — from this workflow's introduction until
#      2026-09-13, when `ai-organiser-runner` was registered specifically to
#      fix the reachability, not just detect its absence.

on:
  schedule:
    # Staggered off the source repo's Mondays 09:30 UTC sweep.
    - cron: '50 9 * * 1'
  workflow_dispatch:
    inputs:
      attempt:
        description: 'Requeue attempt (1-3). Set by the requeue step; leave at 1 for a manual run.'
        required: false
        default: '1'
        type: string
      lock_wait_minutes:
        description: 'Minutes to wait for the shared host lock (default 12, which fits the 30-minute job timeout).'
        required: false
        default: '12'
        type: string

permissions:
  contents: read
  issues: write
  actions: write   # the host-lock requeue dispatches a fresh run of this workflow

concurrency:
  group: architectural-drift
  cancel-in-progress: false

jobs:
  drift:
    # SELF-HOSTED, not ubuntu-latest. AUDIT_DB_URL points at a private-LAN NAS
    # address — a GitHub-hosted runner has no route to that network at all, a
    # routing impossibility no secret can fix. This ran on ubuntu-latest for
    # this workflow's entire history and correctly FAILED every scheduled run
    # (measured 2026-09-13: 5 consecutive failures since 2026-08-10) — the
    # "hard preflight" below did its job, but the underlying reachability
    # problem needed a runner that's actually on that network.
    # `ai-organiser-runner` is registered against this repo for this job.
    runs-on: self-hosted
    timeout-minutes: 30
    # Every `run:` step below is POSIX (bash `if [ ]`, $GITHUB_OUTPUT appends,
    # heredocs). Actions defaults `run:` to PowerShell on Windows, where none
    # of that parses — confirmed 2026-09-13: `test -f` failed with "The term
    # 'test' is not recognized" the moment this job moved off ubuntu-latest.
    # GIT BASH BY ABSOLUTE 8.3 SHORT PATH, not `shell: bash`: this runner
    # splits the shell string on the first space to find the interpreter, so
    # `C:\Program Files\Git\bin\bash.exe` parses as the command `C:\Program`
    # plus a stray argument. `PROGRA~1` has no space. See storyline's
    # architectural-drift.yml for the same fix, independently required there.
    defaults:
      run:
        shell: 'C:\PROGRA~1\Git\bin\bash.exe -eo pipefail {0}'
    # SHARED HOST LOCK (2026-11-23). This box also runs storyline's self-hosted
    # runner, and the two collided on 2026-11-23 (this job held the host while a
    # storyline job hit its 60-minute budget). The first and last steps take and
    # release C:\ProgramData\actions-host-lock\host.lock; their text is identical
    # to storyline's and must stay identical. The lock wait counts against
    # timeout-minutes above, so it is set below it: a normal run takes ~15 min,
    # and 12 + 15 fits in 30. A busy lock does not fail the run: the acquire
    # step is continue-on-error, every work step is gated on it succeeding, and
    # the requeue step dispatches attempt N+1 (max 3). Attempt 3 still blocked
    # fails red and names the holder, so a skipped sweep is never silent.
    env:
      HOST_LOCK_WAIT_MINUTES: ${{ inputs.lock_wait_minutes || '12' }}
    steps:
      # ── FIRST step of the job, before anything heavy ─────────────────────────────────────────
      - name: Take the shared host lock
        id: lock
        continue-on-error: true
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = 'C:\ProgramData\actions-host-lock\host.lock'
          if (-not (Test-Path -LiteralPath $lock)) {
            throw "FAIL: $lock is missing. It must be pre-created with Modify for both runner accounts. This step will NOT create it: a file created by one account is unwritable by the other, which breaks the lock silently in the only case it matters."
          }
          $w = Get-CimInstance Win32_Process -Filter "ProcessId=$PID"
          while ($w -and $w.Name -ne 'Runner.Worker.exe') {
            $w = Get-CimInstance Win32_Process -Filter "ProcessId=$($w.ParentProcessId)"
          }
          if (-not $w) { throw 'FAIL: no Runner.Worker ancestor -- cannot record a holder that outlives this step.' }
          $mine = [pscustomobject]@{
            repo    = $env:GITHUB_REPOSITORY
            runId   = $env:GITHUB_RUN_ID
            attempt = $env:GITHUB_RUN_ATTEMPT
            pid     = $w.ProcessId
            started = $w.CreationDate.ToUniversalTime().ToString('o')
          }
          "HOST_LOCK_RUN_ID=$($mine.runId)"     | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "HOST_LOCK_ATTEMPT=$($mine.attempt)"  | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          $waitMin  = if ($env:HOST_LOCK_WAIT_MINUTES) { [int]$env:HOST_LOCK_WAIT_MINUTES } else { 75 }
          $deadline = (Get-Date).AddMinutes($waitMin)
          $held     = $null
          while ($true) {
            try {
              $fs = [System.IO.File]::Open($lock, 'Open', 'ReadWrite', 'None')
              try {
                $sr   = New-Object System.IO.StreamReader($fs)
                $text = $sr.ReadToEnd().Trim()
                $free = $true
                if ($text -and $text -ne 'free') {
                  $h = $null
                  try { $h = $text | ConvertFrom-Json } catch { }
                  if (-not $h) {
                    # Unparseable content is NOT treated as free: that would turn a corrupt lock
                    # into no lock. Fail loudly and let a human look.
                    throw "FAIL: $lock holds unparseable content; refusing to assume it is free. Content: $text"
                  }
                  $alive = Get-CimInstance Win32_Process -Filter "ProcessId=$($h.pid)" -ErrorAction SilentlyContinue
                  $same  = $alive -and ($alive.CreationDate.ToUniversalTime().ToString('o') -eq $h.started)
                  if ($same) { $free = $false; $held = $h }
                  else { Write-Host "host-lock: taking over a stale record (repo=$($h.repo) run=$($h.runId) pid=$($h.pid) started=$($h.started)) -- that process is gone." }
                }
                if ($free) {
                  $fs.SetLength(0)
                  $sw = New-Object System.IO.StreamWriter($fs)
                  $sw.Write(($mine | ConvertTo-Json -Compress)); $sw.Flush()
                  Write-Host "host-lock: acquired by $($mine.repo) run $($mine.runId) attempt $($mine.attempt) (worker pid $($mine.pid))."
                  break
                }
              } finally { $fs.Dispose() }
            } catch [System.IO.IOException] { }   # another job holds the handle for its own CAS; retry
            if ((Get-Date) -ge $deadline) {
              throw "FAIL: host lock not acquired within $waitMin min. Holder: repo=$($held.repo) run=$($held.runId) attempt=$($held.attempt) pid=$($held.pid) started=$($held.started). This job did NOT run unlocked."
            }
            Start-Sleep -Seconds 10
          }

      # Not part of the shared snippet: ai-organiser's response to a busy lock.
      - name: Requeue if the host lock was busy
        if: steps.lock.outcome == 'failure'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ATTEMPT: ${{ inputs.attempt || '1' }}
          LOCK_WAIT: ${{ inputs.lock_wait_minutes || '12' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $max  = 3
          $n    = [int]$env:ATTEMPT
          $lock = 'C:\ProgramData\actions-host-lock\host.lock'
          $h = $null
          for ($i = 0; $i -lt 10 -and -not $h; $i++) {
            try {
              $t = (Get-Content -LiteralPath $lock -Raw).Trim()
              if ($t -and $t -ne 'free') { $h = $t | ConvertFrom-Json }
              break
            } catch [System.IO.IOException] { Start-Sleep -Seconds 2 } catch { break }
          }
          if (-not $h -or -not $h.runId) {
            Write-Host '::error::The host-lock step failed for a reason other than a busy lock (see its log). Drift did NOT run and was not requeued.'
            exit 1
          }
          $who = "$($h.repo) run $($h.runId) since $($h.started)"
          if ($n -ge $max) {
            Write-Host "::error::host lock held by $who on attempt $n of $max. Drift did NOT run; giving up."
            exit 1
          }
          $next = $n + 1
          gh workflow run architectural-drift.yml --repo $env:GITHUB_REPOSITORY --ref $env:GITHUB_REF_NAME -f "attempt=$next" -f "lock_wait_minutes=$env:LOCK_WAIT"
          if ($LASTEXITCODE -ne 0) { Write-Host '::error::requeue dispatch failed; drift did NOT run.'; exit 1 }
          Write-Host "::notice::deferred: host lock held by $who; requeued as attempt $next"

      - name: Checkout
        if: steps.lock.outcome == 'success'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: steps.lock.outcome == 'success'
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        if: steps.lock.outcome == 'success'
        run: npm ci --ignore-scripts

      # Without this, `npm run arch:drift` is MODULE_NOT_FOUND, Node exits 1,
      # and the exit-code map below reads 1 as "drift triggered" — filing a
      # bogus sticky issue off a missing file. Upstream is public; no token.
      - name: Checkout upstream tooling
        if: steps.lock.outcome == 'success'
        uses: actions/checkout@v7
        with:
          repository: Lbstrydom/claude-engineering-skills
          path: .upstream-skills

      - name: Hydrate scripts/.claude-skills
        if: steps.lock.outcome == 'success'
        run: |
          mkdir -p scripts/.claude-skills
          cp -R .upstream-skills/scripts/. scripts/.claude-skills/
          # Fail loudly here rather than let a partial copy surface as a
          # drift signal three steps later.
          test -f scripts/.claude-skills/symbol-index/drift.mjs
          test -f scripts/.claude-skills/symbol-index/prune.mjs
          test -f scripts/.claude-skills/learning-store.mjs

      # A never-provisioned secret arrives as an EMPTY STRING, not an absent
      # key, so a presence-only check passes it through. Upstream then skips
      # every real step and the run reports success — a green certifying only
      # that the runner booted. Fail closed instead. Never echoes the value.
      - name: Preflight AUDIT_DB_URL
        if: steps.lock.outcome == 'success'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
        run: |
          if [ -z "$AUDIT_DB_URL" ]; then
            echo "::error::AUDIT_DB_URL is unset or empty. Refusing to report a clean pass having checked nothing. Set the repository secret, then re-run."
            exit 1
          fi
          echo "AUDIT_DB_URL present (value not echoed)."

      - name: Refresh architectural memory (full)
        if: steps.lock.outcome == 'success'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: ${{ secrets.AUDIT_DB_SSL_MODE }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npm run arch:refresh:full || true

      - name: Run drift sweep
        if: steps.lock.outcome == 'success'
        id: drift
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: ${{ secrets.AUDIT_DB_SSL_MODE }}
        run: |
          set +e
          npm run arch:drift -- --out /tmp/architectural-drift.md
          EXIT=$?
          set -e
          echo "exit=$EXIT" >> "$GITHUB_OUTPUT"
          if [ "$EXIT" = "0" ]; then echo "status=green" >> "$GITHUB_OUTPUT";
          elif [ "$EXIT" = "1" ]; then echo "status=triggered" >> "$GITHUB_OUTPUT";
          else echo "status=error" >> "$GITHUB_OUTPUT"; fi

      - name: Run retention prune
        if: steps.lock.outcome == 'success'
        env:
          AUDIT_DB_URL: ${{ secrets.AUDIT_DB_URL }}
          AUDIT_DB_SSL_MODE: ${{ secrets.AUDIT_DB_SSL_MODE }}
        run: npm run arch:prune || true

      # NOTE: upstream gates this on hashFiles('/tmp/architectural-drift.md'),
      # which always evaluates empty — hashFiles resolves relative to
      # GITHUB_WORKSPACE and cannot see /tmp, so the artefact is never
      # uploaded there. Using always() + if-no-files-found instead.
      - name: Upload report artefact
        if: always() && steps.drift.outcome != 'skipped'
        uses: actions/upload-artifact@v7
        with:
          name: architectural-drift-report
          path: /tmp/architectural-drift.md
          if-no-files-found: ignore
          retention-days: 90

      - name: Open / update sticky issue on trigger
        if: steps.drift.outputs.status == 'triggered'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=architectural-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:architectural-drift -->"))][0].number' 2>/dev/null || echo '')
          BODY=$(cat /tmp/architectural-drift.md)
          RUN_URL="https://github.com/$REPO/actions/runs/${{ github.run_id }}"
          FOOTER=$'\n\n---\n_Auto-generated by `.github/workflows/architectural-drift.yml` — ['"run"']('"$RUN_URL"')._ '
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            printf '%s%s' "$BODY" "$FOOTER" > /tmp/issue-body.md
            gh issue edit "$EXISTING" --body-file /tmp/issue-body.md --repo "$REPO"
            gh issue comment "$EXISTING" --repo "$REPO" --body "Re-triggered on $(date -u +%Y-%m-%d). See [workflow run]($RUN_URL)."
          else
            printf '%s%s' "$BODY" "$FOOTER" > /tmp/issue-body.md
            gh label create architectural-drift --color D93F0B --description 'Architectural drift trigger fired' --repo "$REPO" 2>/dev/null || true
            gh issue create --repo "$REPO" \
              --title "architectural-drift: trigger fired ($(date -u +%Y-%m-%d))" \
              --label architectural-drift \
              --body-file /tmp/issue-body.md
          fi

      - name: Auto-close sticky issue if green
        if: steps.drift.outputs.status == 'green'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          EXISTING=$(gh api "repos/$REPO/issues?state=open&labels=architectural-drift&per_page=50" \
            --jq '[.[] | select(.body // "" | startswith("<!-- audit-loop:architectural-drift -->"))][0].number' 2>/dev/null || echo '')
          if [ -n "$EXISTING" ] && [ "$EXISTING" != "null" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "Drift returned to green on $(date -u +%Y-%m-%d). Auto-closing — reopen if a regression is observed."
            gh issue close "$EXISTING" --repo "$REPO"
          fi

      - name: Fail workflow on infra error
        if: steps.drift.outputs.status == 'error'
        run: |
          echo "::error::drift script failed with exit code 2 (infra error, not a drift signal)"
          exit 1

      # ── LAST step of the job ─────────────────────────────────────────────────────────────────
      - name: Release the shared host lock
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $lock = 'C:\ProgramData\actions-host-lock\host.lock'
          if (-not (Test-Path -LiteralPath $lock)) { Write-Host 'host-lock: file missing at release; nothing to do.'; exit 0 }
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $fs = [System.IO.File]::Open($lock, 'Open', 'ReadWrite', 'None')
              try {
                $sr = New-Object System.IO.StreamReader($fs)
                $t  = $sr.ReadToEnd().Trim()
                $h  = $null
                if ($t -and $t -ne 'free') { try { $h = $t | ConvertFrom-Json } catch { } }
                # Release ONLY our own record: after a stale takeover the lock belongs to someone
                # else, and freeing it would hand the host to a third job mid-run.
                if ($h -and "$($h.runId)" -eq "$env:HOST_LOCK_RUN_ID" -and "$($h.attempt)" -eq "$env:HOST_LOCK_ATTEMPT") {
                  $fs.SetLength(0)
                  $sw = New-Object System.IO.StreamWriter($fs); $sw.Write('free'); $sw.Flush()
                  Write-Host 'host-lock: released.'
                } else {
                  Write-Host "host-lock: not ours any more (content: $t) -- left untouched."
                }
              } finally { $fs.Dispose() }
              exit 0
            } catch [System.IO.IOException] { Start-Sleep -Seconds 2 }
          }
          Write-Host '::warning::host-lock: could not open the lock to release it; the next job will take it over as stale.'
